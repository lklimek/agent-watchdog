[paths]
allowed_worktree_roots = ["/monitored/worktrees", "/monitored/agent-worktrees"]
# One runtime-native host prefix for each mounted root above, in the same order.
native_worktree_roots = ["/home/example/git", "/data/git-worktrees"]
# Runtime-native roots correspond positionally to their narrow read-only mounts.
# They are needed because state databases retain host paths that do not exist in
# the container. The Claude sessions root is the process-scoped live registry;
# keep it after projects, teams, and tasks. Edit these examples to match the
# bind-mount sources.
native_claude_roots = [
  "/home/example/.claude/projects",
  "/home/example/.claude/teams",
  "/home/example/.claude/tasks",
  "/home/example/.claude/sessions",
]
claude_roots = [
  "/monitored/claude/projects",
  "/monitored/claude/teams",
  "/monitored/claude/tasks",
  "/monitored/claude/sessions",
]
native_codex_roots = [
  "/home/example/.codex",
  "/home/example/.codex/sessions",
]
codex_roots = [
  "/monitored/codex/state",
  "/monitored/codex/sessions",
]
native_companion_roots = ["/home/example/.claude/plugins/data/codex-openai-codex/state"]
companion_roots = ["/monitored/companion"]
exclusions = []

[thresholds]
suspect_after_seconds = 300
stalled_after_seconds = 900
reminder_every_seconds = 300
terminate_after_stalled_seconds = 3600
warning_grace_seconds = 600
action_grace_seconds = 600

[adapters]
claude = true
codex = true
companion = true

[github]
enabled = true

[termination]
automation_enabled = false
sigkill_enabled = true
